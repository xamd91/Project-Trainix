{%extends "base.html" %}

{% block title %} Trainix | Register {% endblock %}

{% block extra_css %} <link rel="stylesheet" href="../static/css/register.css"> {% endblock %}

{% block content %}

    <div class="main-container">
        <div class="register-card">
            <div class="icon-container">
                <i class="fas fa-user-plus"></i>
            </div>

            <h1 class="cormorant-garamond-heading">Create an Account</h1>
            <p class="subtitle">Register your details below to get started.</p>

            <form action="/register" method="POST" id="register-form">

                <div class="input-grid">
                    <div class="input-group">
                        <input type="text" id="firstname" name="firstname" placeholder="First Name" required>
                    </div>

                    <div class="input-group">
                        <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
                    </div>

                    <div class="input-group">
                        <input type="text" id="phone" name="phone" placeholder="Phone Number (+44)" required>
                    </div>

                    <div class="input-group">
                        <input type="email" id="email" name="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>
                    </div>
                </div>

                <label class="terms-checkbox">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                </label>

                <button type="submit" class="submit-btn caveat-btn">Create Account</button>
            </form>

            <p class="login-text">Already have an account? <a href="/login">Log in here</a></p>
        
        </div>
    </div>
    
    <div class="error-modal-container" id="error-modal-container">
        <div class="modal-content">
            <div class="error-icon">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <h2>Account Creation Failed!</h2>
            <p id="error-modal-message"></p>
            <button class="error-modal-close" id="error-modal-close">Close</button>
        </div>
    </div>

    <div class="success-modal-container" id="success-modal-container">
        <div class="modal-content success">
            <div class="success-icon">
                <i class="fas fa-circle-check"></i>
            </div>
            <h2>Account Created!</h2>
            <p id="success-modal-message"></p>
            <button class="success-modal-close" id="success-modal-close">Close</button>
        </div>
    </div>

{% endblock %}
